<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .player-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .controls button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .volume-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        input[type=range] {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Audio Player</h2>
        
        <audio id="myAudio">
            <source src="audio1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div class="controls">
            <button onclick="playAudio()">Play</button>
            <button onclick="pauseAudio()">Pause</button>
            <button onclick="startOver()">Start Over</button>
        </div>

        <div class="volume-control">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="adjustVolume()">
        </div>
    </div>

    <script>
        // Target the audio element and the volume slider
        const audio = document.getElementById("myAudio");
        const volumeSlider = document.getElementById("volumeSlider");

        // Play the audio
        function playAudio() {
            audio.play();
        }

        // Pause the audio
        function pauseAudio() {
            audio.pause();
        }

        // Reset audio to the beginning and play
        function startOver() {
            audio.currentTime = 0;
            audio.play(); 
        }

        // Adjust the volume based on the slider's value
        function adjustVolume() {
            audio.volume = volumeSlider.value;
        }
    </script>

</body>
</html>
