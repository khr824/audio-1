<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .player-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .controls button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 40px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .controls button:hover {
            background-color: #218838;
        }
        .time-display {
            font-size: 18px;
            font-weight: bold;
            color: #444;
            margin: 15px 0;
            display: flex;
            justify-content: space-around;
        }
        .volume-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        input[type=range] {
            cursor: pointer;
        }
        .status-text {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            min-height: 15px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Audio Player</h2>
        
        <audio id="myAudio">
            <source src="audio1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div class="time-display">
            <span id="currentTimeText">0:00</span>
            <span id="timeLeftText">-0:00</span>
        </div>

        <div class="controls">
            <button onclick="playAudio()" id="playBtn">Play</button>
        </div>

        <div class="volume-control">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="adjustVolume()">
        </div>

        <div class="status-text" id="statusMessage">Ready to play.</div>
    </div>

    <script>
        const audio = document.getElementById("myAudio");
        const volumeSlider = document.getElementById("volumeSlider");
        const statusMessage = document.getElementById("statusMessage");
        const playBtn = document.getElementById("playBtn");
        const currentTimeText = document.getElementById("currentTimeText");
        const timeLeftText = document.getElementById("timeLeftText");

        // Helper function to format seconds into M:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" + s : s);
        }

        // 1. Check for saved progress when the page loads
        window.addEventListener('load', () => {
            const savedTime = localStorage.getItem('audio1_progress');
            if (savedTime) {
                audio.currentTime = parseFloat(savedTime);
                statusMessage.innerText = "Progress found. Ready to resume.";
            }
        });

        // 2. Wait for audio metadata to load so we know the total duration
        audio.addEventListener('loadedmetadata', () => {
            // Update the display immediately upon load (in case they resume halfway)
            updateTimeDisplay();
        });

        // 3. Update the time displays and save progress as it plays
        audio.addEventListener('timeupdate', () => {
            localStorage.setItem('audio1_progress', audio.currentTime);
            updateTimeDisplay();
        });

        // Function to handle the visual time updates
        function updateTimeDisplay() {
            // Current Time
            currentTimeText.innerText = formatTime(audio.currentTime);
            // Time Left (Total Duration minus Current Time)
            const timeLeft = audio.duration - audio.currentTime;
            timeLeftText.innerText = "-" + formatTime(timeLeft);
        }

        // 4. Clear the saved progress once the audio finishes completely
        audio.addEventListener('ended', () => {
            localStorage.removeItem('audio1_progress');
            statusMessage.innerText = "Audio finished.";
            playBtn.innerText = "Play Again";
            playBtn.disabled = false; // Re-enable so they can play again
            playBtn.style.backgroundColor = "#28a745"; // Revert to green
            playBtn.style.cursor = "pointer";
        });

        // 5. Play function
        function playAudio() {
            audio.play();
            statusMessage.innerText = "Playing...";
            playBtn.innerText = "Playing..."; 
            playBtn.disabled = true; // Prevents spam-clicking once it's already playing
            playBtn.style.backgroundColor = "#6c757d"; // Changes color to show it's active
            playBtn.style.cursor = "default";
        }

        // 6. Volume adjustment function
        function adjustVolume() {
            audio.volume = volumeSlider.value;
        }
    </script>

</body>
</html>
